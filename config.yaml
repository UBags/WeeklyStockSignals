# trip_ema example configuration
#
# Only `database`, `ema`, `atr`, and `market_hours` are required. All
# other sections have safe defaults; uncomment to override.
# Durations default to minutes unless a suffix says otherwise.

database:
  driver: postgresql
  host: localhost
  port: 5432
  database: trip_ema
  user: trip_ema_app
  password_env: TRIP_EMA_DB_PASSWORD
  tickers_table: tickers
  bars_table: ohlcv_bars
  # --- Phase 12: per-process least-privilege roles (optional) ---
  # The roles are created by Alembic migration 0002_db_roles.py.
  # Operators grant LOGIN + set passwords as a deployment step,
  # then uncomment this block. Without it, all processes use the
  # top-level user/password above. See docs/ARCHITECTURE.md §8.6.
  # roles:
  #   etl:
  #     user: trip_etl_user
  #     password_env: TRIP_EMA_DB_ETL_PASSWORD
  #   engine:
  #     user: trip_engine_user
  #     password_env: TRIP_EMA_DB_ENGINE_PASSWORD
  #   gui:
  #     user: trip_gui_user
  #     password_env: TRIP_EMA_DB_GUI_PASSWORD

# EMA parameters per stage. Match the Pine indicator defaults.
ema:
  med:
    base: 8
    s1: 4
    s2: 4
    final: null              # `med` has no final stage in Pine
  long:
    base: 15
    s1: 4
    s2: 4
    final: 3
  longest:
    base: 28
    s1: 7
    s2: 5
    final: 3

atr:
  length: 14
  inner_mult: 0.2
  mid_mult: 2.0
  outer_mult: 4.0


# ---------------------------------------------------------------------------
# market_hours
#
# Phase 16a — per-exchange explicit tick schedule via `tick_schedule:`.
# Each entry names one of the four daily ticks and anchors it relative
# to the market's open/close (or the midpoint of the flanking ticks):
#
#     tick_schedule:
#       - { name: post_open,   anchor: open,     offset_minutes:  15 }
#       - { name: mid_session, anchor: midpoint                       }
#       - { name: pre_close,   anchor: close,    offset_minutes: -30 }
#       - { name: post_close,  anchor: close,    offset_minutes:  60 }
#
# `anchor: midpoint` carries no offset — its instant is the arithmetic
# midpoint of the latest open-anchored entry and the earliest close-
# anchored entry. This makes the schedule auto-shrink correctly on
# short sessions (e.g. NYSE 1pm ET early-close days).
#
# When `tick_schedule:` is present the legacy three-field cadence
# (`post_open_offset_minutes`, `pre_close_offset_minutes`,
# `intraday_cadence_minutes`) is ignored. Leaving the block out keeps
# the legacy hourly behavior unchanged for backward compatibility.
# ---------------------------------------------------------------------------

market_hours:
  - exchange: NSE
    open: "09:15"
    close: "15:30"
    tz: Asia/Kolkata
    weekdays: [1, 2, 3, 4, 5]
    holidays_country: IN               # python-holidays code for IN federal holidays
    holidays_override_file: configs/nse_holidays_2026.yaml  # operator overrides
    # Four-tick schedule per Phase 16a spec.
    # Resolved instants (IST):
    #   post_open   = 09:15 + 15min  = 09:30
    #   mid_session = midpoint(09:30, 15:00) = 12:15
    #   pre_close   = 15:30 - 30min  = 15:00
    #   post_close  = 15:30 + 60min  = 16:30
    tick_schedule:
      - { name: post_open,   anchor: open,     offset_minutes:  15 }
      - { name: mid_session, anchor: midpoint                       }
      - { name: pre_close,   anchor: close,    offset_minutes: -30 }
      - { name: post_close,  anchor: close,    offset_minutes:  60 }

  - exchange: NYSE
    open: "09:30"
    close: "16:00"
    tz: America/New_York
    weekdays: [1, 2, 3, 4, 5]
    holidays_country: US
    # Same four-tick shape; offsets are relative to NYSE's open/close
    # so half-day sessions (1pm ET early close) auto-shrink without
    # special-casing in the scheduler.
    # Resolved instants on a standard session (ET):
    #   post_open   = 09:30 + 15min  = 09:45
    #   mid_session = midpoint(09:45, 15:30) = 12:37:30  (rounded by tick_planner)
    #   pre_close   = 16:00 - 30min  = 15:30
    #   post_close  = 16:00 + 60min  = 17:00
    tick_schedule:
      - { name: post_open,   anchor: open,     offset_minutes:  15 }
      - { name: mid_session, anchor: midpoint                       }
      - { name: pre_close,   anchor: close,    offset_minutes: -30 }
      - { name: post_close,  anchor: close,    offset_minutes:  60 }

  - exchange: BSE
    open: "09:15"
    close: "15:30"
    tz: Asia/Kolkata
    weekdays: [1, 2, 3, 4, 5]
    holidays_country: IN
    holidays_override_file: configs/nse_holidays_2026.yaml  # BSE shares the IST exchange-holiday list
    tick_schedule:
      - { name: post_open,   anchor: open,     offset_minutes:  15 }
      - { name: mid_session, anchor: midpoint                       }
      - { name: pre_close,   anchor: close,    offset_minutes: -30 }
      - { name: post_close,  anchor: close,    offset_minutes:  60 }

# ---------------------------------------------------------------------------
# Example override file: configs/nse_holidays_2026.yaml
# ---------------------------------------------------------------------------
# extra_holidays:
#   - 2026-01-26   # Republic Day (also caught by python-holidays IN)
#   - 2026-08-15   # Independence Day
# special_trading_days:
#   - 2026-11-12   # Muhurat Trading on Diwali (Saturday, market open ~18:30)

# ---------------------------------------------------------------------------
# scheduling
# ---------------------------------------------------------------------------
# Phase 3b: RunScheduler (wall-clock tick planner) + RunDispatcher are the
# only scheduling subsystems in this codebase. MarketOrchestrator +
# OrchestratorPool + PulseState were deleted; there is no rollback path
# on this branch.
#
# The `orchestrator:` block below is kept for backward config-file compat
# only — SchedulingConfig still declares an `orchestrator` field that
# accepts these keys, but nothing at runtime reads them. Delete the
# block whenever you want; the service works with or without it.
# ---------------------------------------------------------------------------

scheduling:
  compute_cadence_minutes: 60          # legacy field, ignored at runtime
  subscriber_cadence_minutes: 15       # only consulted by the notifier worker
                                        # (Redis mode); ignored otherwise
  default_timeframe: "1W"

  orchestrator:                        # vestigial — safe to delete later
    enabled: false
    catch_up_on_startup: false
    catch_up_skip_if_recent_minutes: 30
    fetch_timeout_seconds: 600
    fetch_retry_delay_minutes: 5

cache:
  max_history_bars: 1000            # bars loaded into each TickerEngine
  state_history_retain: 200         # BarStates kept per engine

http:
  host: 0.0.0.0
  port: 8000
  # admin_token_env: TRIP_EMA_ADMIN_TOKEN   # env var name for bearer token
  # notifier_subprocess_shutdown_timeout_seconds: 15

# --- Phase 10: observability ----------------------------------------
# All sub-fields have defaults; this whole section can be omitted.
# observability:
#   metrics_port: 9090              # Prometheus /metrics on a separate port
#                                   # (omit / null = metrics server NOT started)
#   log_json: false                 # set true for Loki / ELK
#   tracing:
#     enabled: false
#     service_name: trip_ema
#     exporter: console             # console | otlp
#     otlp_endpoint: null           # required when exporter=otlp

# --- Phase 10: transport circuit breakers + Brevo email --------------
transports:
  # Circuit breaker stays at defaults; uncomment to tune.
  # circuit_breaker:
  #   enabled: true
  #   failure_threshold: 5
  #   reset_timeout_seconds: 30
  #   half_open_max_successes: 1

  # Brevo (formerly Sendinblue) HTTP API email transport.
  # Comment this whole block out to fall back to NullTransport (silent
  # success for email subscribers — useful for dev/test). The api_key
  # itself lives in secrets/brevo.yaml (chmod 600, .gitignored).
  brevo:
    secrets_file: secrets/brevo.yaml
    sender_email: weeklystocksignals@outlook.com   # MUST be verified in Brevo Senders
    sender_name: WeeklyStockSignals
    subject: "Trip EMA signal updates"
    # api_url: https://api.brevo.com/v3/smtp/email   # default; override only for proxy
    # timeout_seconds: 30                            # default

# --- Phase 11: ETL (used by `trip-ema-etl` CLI, NOT by the main app) -
# The ETL section is read by the trip-ema-etl CLI when it runs as a
# separate process. The main service ignores it.
etl:
#   exchange: NSE
   # Tiers affect fetch ORDER only (tier-1 first, for Ctrl-C
   # safety on backfills). Scope is always the full universe:
   # every run (intraday / eod / backfill) fetches all tickers.
   tier_1_size: 200                # NIFTY 200 → tier-1
#   tier_2_size: 500                # next 500 → tier-2
#                                   # everything else → tier-3
   park_failure_threshold: 3       # park after this many consecutive failures
   industry_index_min_constituents: 2  # was 4, which left 32 industries
                                       # unindexed and therefore without
                                       # ensemble features. 2 admits 18 of
                                       # them; the rest have one ticker.
                                       # See the schema docstring for what a
                                       # thin index costs in signal quality.
   yfinance_batch_size: 100
   yfinance_min_request_gap_seconds: 5.0  # GLOBAL floor: no two OHLCV
                                          # downloads start closer together
                                          # than this, across ALL fetch
                                          # threads and all retry layers.
                                          # Retry layers re-batch at
                                          # yfinance_batch_size / 2 = 50,
                                          # single-threaded.
#   yfinance_concurrency: 4
   yfinance_request_delay_seconds: 120   # D4: was 30 — 30s dead sleep per batch; gate handles real 429s

   # --- Fundamentals reference sweeps (refresh-industry / -shares /
   # --- -financials). SEPARATE from the yfinance_* keys above, which size the
   # --- OHLCV bar batches. The sweeps make one lightweight .info call per
   # --- ticker across thousands of tickers, so they trip Yahoo's per-IP
   # --- limiter far more easily than a few batched bar downloads.
   fundamentals_concurrency: 3            # THREADS for all three sweeps
                                          # (industry, shares-outstanding,
                                          # financials). Was an unbounded ~8
                                          # from the shared default. 3 =
                                          # polite, still ~3x serial. Drop to
                                          # 2 if 429s persist.
   fundamentals_request_delay_seconds: 2.0  # pause each worker takes before
                                          # its next call, jittered 50-100%.
                                          # These sweeps are 1 HTTP request
                                          # PER TICKER (~2,700 per sweep), so
                                          # aggregate rate is roughly
                                          # concurrency / this = ~6 req/s.
                                          # 0.0 disables the pause.
   fundamentals_min_request_gap_seconds: 1.0  # GLOBAL floor: no two yfinance
                                          # requests start closer together
                                          # than this, across ALL threads.
                                          # request_delay above paces each
                                          # thread separately, so threads can
                                          # still fire together -- THIS is the
                                          # knob that stops burst 429s.
                                          #
                                          # Throughput becomes 1/gap req/s and
                                          # extra threads add no rate:
                                          #   10s -> ~7.5h per sweep
                                          #    5s -> ~3.7h
                                          #    2s -> ~1.5h
                                          #    1s -> ~45m
                                          # Start at 5, walk it down once
                                          # Yahoo stops throttling. 0 = off.
   fundamentals_retry_gap_seconds: 2.0    # spacing for the
                                          # SINGLE-THREADED retry layers over
                                          # the first pass's failures. Cost is
                                          # len(failures) x this, so a tighter
                                          # gap than the sweep gap above is
                                          # affordable here.
   fundamentals_rate_limit_cooloff_seconds: 60   # BASE backoff after a 429.
                                          # Each further attempt doubles it
                                          # (60 -> 120 -> 240), jittered, and
                                          # capped at 900s per sleep.
   fundamentals_rate_limit_attempts: 3    # total tries per ticker (1 = no
                                          # retry). Exhausted -> ticker counted
                                          # failed, run ends PARTIAL, resumable
                                          # with --resume <RUN_ID>.
#   reconcile_window_days: 7
#   parked_dir: var/etl/parked
#   checkpoint_dir: var/etl
#   eod_run_hour_ist: 17
#   eod_run_minute_ist: 30
#   intraday_lookback_days: 5

# --- Phase 9: optional Redis queue mode for the notifier ------------
# If `redis` is omitted, the SubscriberDistributor runs in legacy
# in-process mode (synchronous transport calls from the distributor
# thread). When set, the distributor enqueues jobs to Redis and a
# separate `trip-ema-notifier` worker process dispatches them.
# redis:
#   host: localhost
#   port: 6379
#   db: 0
#   password_env: TRIP_EMA_REDIS_PASSWORD   # optional

# notifier:
#   # Only consulted when `redis` is set above.
#   worker_concurrency: 4
#   queue_name: trip_ema_notifications

# --- Phase 15a: optional per-(exchange, timeframe) indicator overrides ----
# Consumed ONLY by the backtest signal generator (`trip-ema-etl
# generate-signals` / `POST /v1/admin/signals/generate`). The live
# engine continues to use the global `ema:` + `atr:` blocks above
# until a later phase migrates it (per design OOS-7).
#
# Resolution: for a given (exchange, timeframe), the resolver checks
# `exchange_overrides[exchange][timeframe]`. If present, the override
# wins; otherwise it falls back to the global block. Missing
# entries are normal — only override where you actually want tuning.
#
# Validation runs at config load time:
#   - exchange keys must appear in market_hours: above
#   - timeframe keys must be "1D" or "1W" (Phase 15 only)
#   - a bad config fails fast with a clear error message
#
# Uncomment and adjust as needed. The example below reproduces the
# global defaults so you can copy-and-modify rather than starting
# from scratch.
#
# exchange_overrides:
#   NSE:
#     "1W":
#       ema:
#         med:     { base: 8,  s1: 4, s2: 4, final: null }
#         long:    { base: 15, s1: 4, s2: 4, final: 3 }
#         longest: { base: 28, s1: 7, s2: 5, final: 3 }
#         volume_sma_length: 2
#       atr:
#         length: 14
#         inner_mult: 0.2
#         mid_mult: 2.0
#         outer_mult: 4.0
#     "1D":
#       ema:
#         med:     { base: 8,  s1: 4, s2: 4, final: null }
#         long:    { base: 15, s1: 4, s2: 4, final: 3 }
#         longest: { base: 28, s1: 7, s2: 5, final: 3 }
#       atr:
#         length: 14
#         inner_mult: 0.2
#         mid_mult: 2.0
#         outer_mult: 4.0