# trip_ema Alembic configuration.
#
# The DB URL is NOT set here — env.py reads it from the trip_ema
# config.yaml (via load_config). See alembic_pkg/env.py for details
# on how to point at a specific config file.
#
# Coexistence with the legacy migrator: this Alembic setup tracks
# migrations >= 011 only. Files 001-010 in migrations/ are handled
# by trip_ema.persistence.migrator (the small SQL runner used since
# Phase 1). On a fresh DB:
#
#   1. trip-ema migrate    (runs legacy 001-010 + records in schema_migrations)
#   2. alembic stamp <baseline_rev>    (marks Alembic as up-to-date)
#   3. alembic upgrade head    (applies any future revisions)
#
# Step 2 happens automatically the first time trip-ema starts on a
# pre-Alembic database — see trip_ema.persistence.alembic_bridge.

[alembic]
script_location = %(here)s/alembic_pkg
prepend_sys_path = .
path_separator = os

# sqlalchemy.url intentionally absent — env.py loads from config.yaml.

# ============================================================
# Logging
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
