[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
no_implicit_optional = False
exclude = (^tests/|^\.venv/|^scripts/)

# Silence PySide6 / Qt enum noise. PySide6 6.6+ moved enum members into
# nested enum classes (Qt.AlignmentFlag.AlignRight instead of Qt.AlignRight).
# The old attribute-style access still works at runtime via dunder magic
# but mypy can't see through it without type stubs, which produces ~100
# false-positive [attr-defined] errors that drown out real bugs.
[mypy-PySide6.*]
ignore_errors = True

# Same idea for pyqtgraph (we use pg.PlotWidget, pg.AxisItem etc.) —
# no stubs published; runtime is fine.
[mypy-pyqtgraph.*]
ignore_errors = True

# Our own GUI modules subclass Qt classes and inherit the same noise.
# Silence per-package since the actual bugs in GUI code are rare and
# the Qt-stub-driven errors are dominant.
[mypy-trip_ema.gui.*]
ignore_errors = True

# Strict typing on the modules where runtime bugs cost us.
[mypy-trip_ema.scheduler.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-trip_ema.persistence.*]
disallow_untyped_defs = True
