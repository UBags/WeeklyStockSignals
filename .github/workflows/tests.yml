name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================================
  # Fast path — DB-free tests + the GUI (offscreen Qt).
  # Runs on every push. ~15-30s wall time after dep install.
  # ============================================================
  db-free:
    name: DB-free tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System deps for headless Qt
        # PySide6 wheels include the Qt runtime, but the offscreen
        # platform plugin still needs a handful of host libs to
        # initialize without an X server.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install package + all extras
        run: |
          python -m pip install --upgrade pip
          # Editable install of the package itself + every extra,
          # because the DB-free suite exercises the [gui] paths
          # (Qt) and the [etl] paths (yfinance / nsepython /
          # holidays imports). [test] gives us pytest-qt, etc.
          pip install -e ".[all,gui,test]"

      - name: Run DB-free suite (non-Qt + gui_pure)
        # Split into three invocations to avoid a known pytest-qt
        # teardown race that segfaults the interpreter when
        # pytest-qt tests share a session with non-pytest-qt tests
        # that still import Qt-touching modules (tests/gui_pure).
        # All test ASSERTIONS pass regardless; only the exit
        # cleanup is racy. See PHASE11_CHANGELOG.md.
        run: |
          pytest tests/indicators tests/engine tests/cache \
                 tests/notifications tests/scheduler_pure \
                 tests/notifier_pure tests/config \
                 tests/transports_pure tests/parity \
                 tests/observability tests/etl \
                 tests/gui_pure \
                 -q --tb=short

      - name: Run DB-free suite (Qt-using tests)
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: /tmp/xdg
        # pytest-qt has a known teardown race that can segfault the
        # interpreter AFTER all tests have passed. The test results
        # are reliable; the exit code is not. Capture pytest's
        # output, check if any test failed, and trust that signal.
        run: |
          set +e
          pytest tests/gui -q --tb=short 2>&1 | tee /tmp/gui-output.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -qE "^(FAILED|ERROR)" /tmp/gui-output.log; then
            echo "Real test failure detected"
            exit 1
          fi
          if grep -qE "[0-9]+ passed" /tmp/gui-output.log; then
            echo "All tests passed (exit=$rc may reflect teardown segfault, which is benign)"
            exit 0
          fi
          echo "Could not determine pass/fail from output"
          exit "$rc"

      - name: Smoke test the CLI entry points
        # Verify --help works for every console_script. Catches
        # import-time breakage that the unit tests might miss
        # (e.g. a circular import surfaced only on full load).
        run: |
          trip-ema --help
          trip-ema-notifier --help
          trip-ema-etl --help
          QT_QPA_PLATFORM=offscreen trip-ema-console --help

  # ============================================================
  # Slow path — Postgres-backed integration tests.
  # Gated to main pushes + manual dispatch only.
  # The Postgres service container is provisioned by GitHub
  # Actions; pytest-postgresql uses it as a template.
  # ============================================================
  postgres-integration:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    # Skip on PRs from forks (no secrets available); run on
    # pushes to main and on manual dispatch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trip_ema_ci
          POSTGRES_PASSWORD: trip_ema_ci
          POSTGRES_DB: trip_ema_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]"

      - name: Run Postgres-backed suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: trip_ema_ci
          POSTGRES_PASSWORD: trip_ema_ci
          POSTGRES_DB: trip_ema_ci
        run: |
          pytest tests/persistence tests/scheduler tests/registry \
                 tests/transports tests/notifier tests/api \
                 -q --tb=short

  # ============================================================
  # Lint / typecheck — opt-in, doesn't gate merges.
  # Currently advisory only: ruff for style, mypy strict-ish.
  # ============================================================
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          # mypy is heavy; leave it out for now. Add when type
          # annotations are stable across all phases.

      - name: ruff check
        run: ruff check trip_ema/ tests/
